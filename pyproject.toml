[project]
name = "thanos"
version = "0.1.0"
description = "Local voice agent: Whisper STT + Ollama tool calling + deterministic tools"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "mlx-whisper>=0.4.1",
    "yt-dlp>=2025.1.1",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "kokoro-onnx>=0.6.1",
    "pint>=0.25.3",
    "pypdf>=6.21.4",
]

[project.scripts]
thanos = "thanos.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
